<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#D81B7E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Reproductor Coco">
  <title>Reproductor Coco</title>
  <link rel="manifest" href="./manifest.webmanifest?v=4">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=2">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Titan+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=4">
</head>
<body>
  <div class="bg-gradient" aria-hidden="true"></div>
  <div class="bg-halftone" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"></div>

  <div class="floating-notes" aria-hidden="true">
    <span class="note note--1">♪</span>
    <span class="note note--2">♫</span>
    <span class="note note--3">♩</span>
    <span class="note note--4">♬</span>
  </div>

  <main class="stage">
    <header class="logo-stage">
      <span class="radio-ring radio-ring--1" aria-hidden="true"></span>
      <span class="radio-ring radio-ring--2" aria-hidden="true"></span>
      <span class="radio-ring radio-ring--3" aria-hidden="true"></span>

      <div class="logo-stage__inner" id="logo-inner">
        <img
          id="brand-logo"
          class="brand-logo"
          src="./logo.png"
          alt="Reproductor Coco"
          decoding="async"
        >

        <svg
          id="logo-fallback"
          class="brand-logo brand-logo--fallback"
          viewBox="0 0 380 230"
          role="img"
          aria-label="Reproductor Coco"
          hidden
        >
          <!-- Radiating cartoon radio waves -->
          <g fill="none" stroke-linecap="round">
            <path d="M90 66 Q66 94 90 122" stroke="#3EE0A8" stroke-width="11"/>
            <path d="M90 66 Q66 94 90 122" stroke="#4A154B" stroke-width="5" opacity="0.25"/>
            <path d="M68 48 Q35 94 68 140" stroke="#3EE0A8" stroke-width="9" opacity="0.9"/>
            <path d="M290 66 Q314 94 290 122" stroke="#3EE0A8" stroke-width="11"/>
            <path d="M312 48 Q345 94 312 140" stroke="#3EE0A8" stroke-width="9" opacity="0.9"/>
          </g>

          <!-- Cute twin cartoon coconuts with headphones -->
          <g stroke="#4A154B" stroke-linejoin="round" stroke-linecap="round">
            <!-- Headphone band -->
            <path d="M128 84 C128 28, 252 28, 252 84" fill="none" stroke="#4A154B" stroke-width="14"/>
            <path d="M128 84 C128 28, 252 28, 252 84" fill="none" stroke="#3EE0A8" stroke-width="7"/>

            <!-- Left coconut -->
            <circle cx="152" cy="94" r="40" fill="#8C5327" stroke-width="6"/>
            <path d="M132 67 Q148 56 168 62" fill="none" stroke="#B67642" stroke-width="6"/>
            <!-- Coconut ears / headphones cup left -->
            <rect x="104" y="76" width="18" height="34" rx="9" fill="#F5A3E8" stroke-width="5"/>
            <!-- Coconut face left -->
            <circle cx="141" cy="92" r="4.5" fill="#4A154B" stroke="none"/>
            <circle cx="163" cy="92" r="4.5" fill="#4A154B" stroke="none"/>
            <circle cx="142.5" cy="90.5" r="1.5" fill="#FFFFFF" stroke="none"/>
            <circle cx="164.5" cy="90.5" r="1.5" fill="#FFFFFF" stroke="none"/>
            <ellipse cx="133" cy="100" rx="5" ry="3" fill="#F5A3E8" stroke="none" opacity="0.85"/>
            <ellipse cx="171" cy="100" rx="5" ry="3" fill="#F5A3E8" stroke="none" opacity="0.85"/>
            <path d="M143 103 Q152 113 161 103" fill="none" stroke="#4A154B" stroke-width="4.5"/>

            <!-- Right coconut -->
            <circle cx="228" cy="94" r="40" fill="#9D6030" stroke-width="6"/>
            <path d="M208 67 Q226 56 244 62" fill="none" stroke="#C7854F" stroke-width="6"/>
            <!-- Headphone cup right -->
            <rect x="258" y="76" width="18" height="34" rx="9" fill="#3EE0A8" stroke-width="5"/>
            <!-- Coconut face right (cool wink/smile) -->
            <circle cx="217" cy="92" r="4.5" fill="#4A154B" stroke="none"/>
            <path d="M234 92 Q239 87 244 92" fill="none" stroke="#4A154B" stroke-width="4.5"/>
            <circle cx="218.5" cy="90.5" r="1.5" fill="#FFFFFF" stroke="none"/>
            <ellipse cx="209" cy="100" rx="5" ry="3" fill="#F5A3E8" stroke="none" opacity="0.85"/>
            <ellipse cx="247" cy="100" rx="5" ry="3" fill="#F5A3E8" stroke="none" opacity="0.85"/>
            <path d="M219 103 Q228 113 237 103" fill="none" stroke="#4A154B" stroke-width="4.5"/>

            <!-- Tropical palm tuft -->
            <path d="M190 50 C178 26, 154 28, 150 42 C164 42, 178 46, 190 54 Z" fill="#3EE0A8" stroke-width="4.5"/>
            <path d="M190 50 C202 24, 226 26, 232 42 C216 41, 202 46, 190 54 Z" fill="#3EE0A8" stroke-width="4.5"/>
            <path d="M190 50 C186 22, 196 18, 198 38" fill="#3EE0A8" stroke-width="4.5"/>
          </g>

          <!-- Comic drop shadow + wordmark: COCOTEO -->
          <text
            x="190"
            y="174"
            text-anchor="middle"
            font-family="'Titan One', 'Fredoka', sans-serif"
            font-size="56"
            letter-spacing="1.5"
            fill="#4A154B"
            transform="translate(0 6)"
          >COCOTEO</text>
          <text
            x="190"
            y="174"
            text-anchor="middle"
            font-family="'Titan One', 'Fredoka', sans-serif"
            font-size="56"
            letter-spacing="1.5"
            fill="#F5A3E8"
            stroke="#4A154B"
            stroke-width="11"
            paint-order="stroke fill"
            stroke-linejoin="round"
          >COCOTEO</text>

          <!-- Comic badge: FM -->
          <g transform="translate(190 206)">
            <rect x="-46" y="-22" width="92" height="36" rx="18" fill="#4A154B" transform="translate(0 4)"/>
            <rect x="-46" y="-22" width="92" height="36" rx="18" fill="#FFFFFF" stroke="#4A154B" stroke-width="5"/>
            <text
              x="0"
              y="6"
              text-anchor="middle"
              font-family="'Titan One', 'Fredoka', sans-serif"
              font-size="27"
              letter-spacing="2"
              fill="#3EE0A8"
              stroke="#4A154B"
              stroke-width="6.5"
              paint-order="stroke fill"
              stroke-linejoin="round"
            >FM</text>
          </g>
        </svg>
      </div>
    </header>

    <section class="controls-hero">
      <div class="tune-btn-wrap">
        <div id="sparkle-layer" class="sparkle-layer" aria-hidden="true"></div>
        <button
          id="tune-btn"
          class="tune-btn"
          type="button"
          aria-label="Sintonizar un momento aleatorio en Reproductor Coco"
        >
          <span class="tune-btn__gloss" aria-hidden="true"></span>
          <svg class="tune-btn__icon" viewBox="0 0 28 28" aria-hidden="true">
            <path
              d="M4 11.5C4 9.84 5.34 8.5 7 8.5H21C22.66 8.5 24 9.84 24 11.5V21C24 22.66 22.66 24 21 24H7C5.34 24 4 22.66 4 21V11.5Z"
              fill="#FFFFFF"
              stroke="#4A154B"
              stroke-width="2.4"
              stroke-linejoin="round"
            />
            <path
              d="M9 8.5L19.5 3.5"
              stroke="#4A154B"
              stroke-width="2.6"
              stroke-linecap="round"
            />
            <circle cx="10.5" cy="16.25" r="3.2" fill="#F5A3E8" stroke="#4A154B" stroke-width="2"/>
            <path d="M16.5 14H20.5M16.5 18.5H20.5" stroke="#4A154B" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
          <span id="tune-btn-label" class="tune-btn__label">SINTONIZAR RADIO</span>
        </button>
      </div>
    </section>

    <div id="status-pill" class="status-pill" role="status" aria-live="polite">
      <div class="equalizer" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>
      <span id="status-text" class="status-text">📻 Presiona para sintonizar</span>
      <span class="live-badge" aria-hidden="true">
        <span class="live-dot"></span>
        <span class="live-badge__text">EN VIVO</span>
      </span>
    </div>

    <div id="secondary-controls" class="secondary-controls" aria-label="Controles de audio">
      <button
        id="pause-btn"
        class="icon-btn"
        type="button"
        aria-label="Pausar audio"
        title="Pausar / Reanudar (P)"
        disabled
      >
        <svg class="icon-btn__svg icon-pause" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="6" y="5" width="4.5" height="14" rx="2" fill="currentColor"/>
          <rect x="13.5" y="5" width="4.5" height="14" rx="2" fill="currentColor"/>
        </svg>
        <svg class="icon-btn__svg icon-play" viewBox="0 0 24 24" aria-hidden="true" hidden>
          <path d="M7.5 5.4C7.5 4.55 8.43 4.03 9.15 4.48L18.85 10.58C19.52 11 19.52 12 18.85 12.42L9.15 18.52C8.43 18.97 7.5 18.45 7.5 17.6V5.4Z" fill="currentColor"/>
        </svg>
      </button>

      <button
        id="mute-btn"
        class="icon-btn"
        type="button"
        aria-label="Silenciar audio"
        title="Silenciar / Activar sonido (M)"
        disabled
      >
        <svg class="icon-btn__svg icon-sound" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4.5 9.5H8L13.2 5.2C13.85 4.66 14.8 5.13 14.8 5.97V18.03C14.8 18.87 13.85 19.34 13.2 18.8L8 14.5H4.5C3.67 14.5 3 13.83 3 13V11C3 10.17 3.67 9.5 4.5 9.5Z" fill="currentColor"/>
          <path d="M17.5 8.8C18.7 10.2 18.7 13.8 17.5 15.2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M20.2 6.5C22.2 9.4 22.2 14.6 20.2 17.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <svg class="icon-btn__svg icon-muted" viewBox="0 0 24 24" aria-hidden="true" hidden>
          <path d="M4.5 9.5H8L13.2 5.2C13.85 4.66 14.8 5.13 14.8 5.97V18.03C14.8 18.87 13.85 19.34 13.2 18.8L8 14.5H4.5C3.67 14.5 3 13.83 3 13V11C3 10.17 3.67 9.5 4.5 9.5Z" fill="currentColor"/>
          <path d="M17.5 9.5L21.5 14.5M21.5 9.5L17.5 14.5" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/>
        </svg>
      </button>

      <button
        id="source-btn"
        class="icon-btn"
        type="button"
        aria-label="Configurar URL de audio"
        title="Configurar URL de audio"
      >
        <svg class="icon-btn__svg" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10.5 13.5a5 5 0 0 0 7.07.0l2.12-2.12a5 5 0 0 0-7.07-7.07l-1.2 1.2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M13.5 10.5a5 5 0 0 0-7.07 0L4.3 12.62a5 5 0 1 0 7.07 7.07l1.2-1.2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </main>

  <div id="source-modal" class="source-modal" role="dialog" aria-modal="true" aria-labelledby="source-modal-title" hidden>
    <div class="source-modal__backdrop" data-close-modal></div>
    <div class="source-modal__card">
      <div class="source-modal__header">
        <h2 id="source-modal-title" class="source-modal__title">URL de audio</h2>
        <button id="source-close-btn" class="source-modal__close" type="button" aria-label="Cerrar">✕</button>
      </div>
      <p class="source-modal__hint">
        Pega una URL directa de audio (<code>.mp3</code>, <code>.m4a</code>, <code>.ogg</code> o stream de radio) para reproducir en segundo plano con el ícono y nombre de <strong>Cocoteo FM</strong>.
      </p>
      <form id="source-form" class="source-modal__form" novalidate>
        <input
          id="source-url-input"
          class="source-modal__input"
          type="url"
          inputmode="url"
          placeholder="https://ejemplo.com/cocoteo.mp3"
          autocomplete="off"
          spellcheck="false"
        >
        <p id="source-modal-error" class="source-modal__error" role="alert" hidden></p>
        <div class="source-modal__actions">
          <button id="source-save-btn" class="source-modal__btn source-modal__btn--primary" type="submit">
            Guardar y sonar
          </button>
          <button id="source-reset-btn" class="source-modal__btn source-modal__btn--ghost" type="button">
            Restablecer
          </button>
        </div>
      </form>
    </div>
  </div>

  <audio id="radio-audio" preload="metadata" playsinline></audio>

  <script src="./app.js?v=4" defer></script>
</body>
</html>
